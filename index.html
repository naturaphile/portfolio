<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        /* 1. AUTO-LOADS FONT (.woff2, .woff, .ttf, or .otf named 'helvetica') */
        @font-face {
            font-family: 'HelveticaCustom';
            src: url('helvetica.woff2') format('woff2'),
                 url('helvetica.woff') format('woff'),
                 url('helvetica.ttf') format('truetype'),
                 url('helvetica.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'HelveticaCustom', Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #000000;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* 2. FIXED BLACK HERO SECTION */
        .hero-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            z-index: 1;
        }

        .hero-content {
            will-change: opacity, transform;
            transition: opacity 0.05s linear;
        }

        .hero-container h1 {
            font-size: 3.5rem;
            line-height: 1.2;
            margin-bottom: 1.5rem;
            letter-spacing: -0.02em;
            font-weight: bold;
        }

        .hero-container p {
            font-size: 1rem;
            max-width: 550px;
            line-height: 1.6;
            margin-bottom: 3rem;
            color: #e0e0e0;
        }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            border: 1px solid #ffffff;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: #ffffff;
            color: #000000;
        }

        .scroll-arrow {
            position: absolute;
            bottom: 40px;
            width: 16px;
            height: 16px;
            border-right: 1px solid #ffffff;
            border-bottom: 1px solid #ffffff;
            transform: rotate(45deg);
            opacity: 0.5;
        }

        /* 3. SLIDING WHITE LAYER OVERLAY */
        .white-layer {
            position: relative;
            z-index: 2;
            margin-top: 100vh; /* Pushes white layer below fold initially */
            background-color: #ffffff;
            color: #000000;
            min-height: 100vh;
            box-shadow: 0 -15px 30px rgba(0, 0, 0, 0.4);
        }

        /* White Section Header Bar */
        .white-header {
            position: sticky;
            top: 0;
            background-color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 5%;
            z-index: 10;
        }

        .brand-name {
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .white-nav {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .white-nav a {
            color: #888888;
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.2s ease;
        }

        .white-nav a:hover, .white-nav a.active {
            color: #000000;
        }

        /* 4. 3x3 PHOTO GRID */
        .grid-container {
            padding: 1rem 5% 6rem 5%;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .grid-item {
            aspect-ratio: 1 / 1;
            background-color: #f2f2f2;
            overflow: hidden;
            position: relative;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Mobile Layout */
        @media (max-width: 900px) {
            .grid { grid-template-columns: repeat(2, 1fr); }
            .hero-container h1 { font-size: 2.5rem; }
            .white-header { flex-direction: column; gap: 1rem; align-items: flex-start; }
        }
        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- FIXED HERO SECTION -->
    <div class="hero-container">
        <div class="hero-content">
            <h1>Hi, I'm Jimmy.<br>Designer and<br>problem solver.</h1>
            <p>Welcome to my portfolio of work. I am a freelance designer based in Warrington, UK, creating effective, exciting and engaging branding solutions.</p>
            <a href="mailto:your@email.com" class="btn">Ask me a question</a>
        </div>
        <div class="scroll-arrow"></div>
    </div>

    <!-- SLIDING WHITE OVERLAY LAYER -->
    <div class="white-layer">
        
        <!-- HEADER (Appears as white layer slides up) -->
        <header class="white-header">
            <div class="brand-name">JIMMY DAVIES</div>
            <nav class="white-nav">
                <a href="#" class="active">Projects</a>
                <a href="#">Photography</a>
                <a href="#">Kind Words</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </nav>
        </header>

        <!-- 3x3 IMAGE GRID SECTION -->
        <main class="grid-container">
            <div class="grid">
                <div class="grid-item"><img src="1.jpg" onerror="tryNextFormat(this)"></div>
                <div class="grid-item"><img src="2.jpg" onerror="tryNextFormat(this)"></div>
                <div class="grid-item"><img src="3.jpg" onerror="tryNextFormat(this)"></div>
                <div class="grid-item"><img src="4.jpg" onerror="tryNextFormat(this)"></div>
                <div class="grid-item"><img src="5.jpg" onerror="tryNextFormat(this)"></div>
                <div class="grid-item"><img src="6.jpg" onerror="tryNextFormat(this)"></div>
                <div class="grid-item"><img src="7.jpg" onerror="tryNextFormat(this)"></div>
                <div class="grid-item"><img src="8.jpg" onerror="tryNextFormat(this)"></div>
                <div class="grid-item"><img src="9.jpg" onerror="tryNextFormat(this)"></div>
            </div>
        </main>

    </div>

    <!-- SCRIPTS -->
    <script>
        const heroContent = document.querySelector('.hero-content');

        // Scroll listener: Dims white text as white layer slides over black hero
        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY;
            const windowHeight = window.innerHeight;

            // Opacity decreases from 1 to 0 as you scroll down
            let opacity = 1 - (scrollY / (windowHeight * 0.6));
            if (opacity < 0) opacity = 0;
            if (opacity > 1) opacity = 1;

            heroContent.style.opacity = opacity;
        });

        // Image extension auto-fallback
        function tryNextFormat(img) {
            if (img.src.endsWith('.jpg')) {
                img.src = img.src.replace('.jpg', '.png');
            } else if (img.src.endsWith('.png')) {
                img.src = img.src.replace('.png', '.jpeg');
            } else if (img.src.endsWith('.jpeg')) {
                img.src = img.src.replace('.jpeg', '.webp');
            } else {
                img.style.opacity = '0';
            }
        }
    </script>

</body>
</html>
