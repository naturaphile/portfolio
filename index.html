<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Default title, will be overwritten by title.txt if it exists -->
    <title>Nathan Ramirez | Portfolio</title>
    
    <!-- Tab Icon (Favicon) -->
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        /* 1. AUTO-LOADS FONTS */
        @font-face {
            font-family: 'HelveticaCustom';
            src: url('helvetica.woff2') format('woff2'),
                 url('helvetica.woff') format('woff'),
                 url('helvetica.ttf') format('truetype'),
                 url('helvetica.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'HelveticaCustom';
            src: url('helvetica-bold.woff2') format('woff2'),
                 url('helvetica-bold.woff') format('woff'),
                 url('helvetica-bold.ttf') format('truetype'),
                 url('helvetica-bold.otf') format('opentype');
            font-weight: bold;
            font-style: normal;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'HelveticaCustom', Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #000000;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* 2. FIXED BLACK HERO SECTION */
        .hero-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            z-index: 1;
        }

        @keyframes quickFadeUp {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .hero-content {
            animation: quickFadeUp 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            will-change: filter, opacity; 
        }

        /* --- HERO TITLE WRAPPER FOR DYNAMIC EFFECTS --- */
        .hero-title-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 2rem;
            cursor: default; 
        }

        .hero-title-wrapper h1 {
            font-size: 4.5rem;
            line-height: 1;
            font-weight: bold;
            text-transform: lowercase; 
            margin: 0;
        }

        .name-text-wrapper {
            display: inline-block;
            position: relative;
            z-index: 2;
        }

        .hero-logo-wrapper {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 1;
        }

        .hero-logo {
            position: absolute;
            height: 6.5em; 
            width: auto;
            opacity: 0; 
        }

        .swipe-bar { display: none; } 

        /* ---------------------------------------------------- */
        /* EFFECT 1: XEROX                                      */
        /* ---------------------------------------------------- */
        body.name-effect-xerox .name-first, 
        body.name-effect-xerox .name-last {
            display: inline-block;
            transition: all 0.15s cubic-bezier(0.25, 1, 0.5, 1);
        }
        body.name-effect-xerox .hero-title-wrapper:hover .name-first {
            color: #e0e0e0;
            transform: rotate(-1.5deg) scale(0.98) translateY(2px);
            text-shadow: 3px 3px 0px #444444;
            letter-spacing: -2px;
        }
        body.name-effect-xerox .hero-title-wrapper:hover .name-last {
            color: #e0e0e0;
            transform: rotate(1.5deg) scale(0.98) translateY(-1px);
            text-shadow: -3px 3px 0px #444444;
            letter-spacing: -2px;
        }

        /* ---------------------------------------------------- */
        /* EFFECT 2: CROP                                       */
        /* ---------------------------------------------------- */
        body.name-effect-crop .name-text-wrapper {
            clip-path: inset(0 0 0 0);
            transition: clip-path 0.4s cubic-bezier(0.86, 0, 0.07, 1) 0.4s;
        }
        body.name-effect-crop .hero-logo-normal {
            opacity: 1;
            filter: invert(1); 
            clip-path: inset(0 50% 0 50%);
            transition: clip-path 0.4s cubic-bezier(0.86, 0, 0.07, 1) 0s;
        }
        
        body.name-effect-crop .hero-title-wrapper:hover .name-text-wrapper {
            clip-path: inset(0 50% 0 50%);
            transition: clip-path 0.4s cubic-bezier(0.86, 0, 0.07, 1) 0s;
        }
        body.name-effect-crop .hero-title-wrapper:hover .hero-logo-normal {
            clip-path: inset(0 0 0 0);
            transition: clip-path 0.4s cubic-bezier(0.86, 0, 0.07, 1) 0.4s;
        }

        /* ---------------------------------------------------- */
        /* EFFECT 3: GLITCH                                     */
        /* ---------------------------------------------------- */
        body.name-effect-glitch .name-text-wrapper {
            transition: all 0.1s;
        }
        body.name-effect-glitch .hero-logo-alt {
            opacity: 0;
            transform: scale(0.9);
            filter: invert(1) drop-shadow(4px 0 0 #00FFFF) drop-shadow(-4px 0 0 #FF00FF);
            transition: all 0.1s;
        }

        body.name-effect-glitch .hero-title-wrapper:hover .name-text-wrapper {
            opacity: 0;
            filter: blur(8px);
            transform: scale(1.05);
        }
        body.name-effect-glitch .hero-title-wrapper:hover .hero-logo-alt {
            opacity: 1;
            transform: scale(1) skewX(-10deg);
        }

        /* ---------------------------------------------------- */
        /* EFFECT 4: SWIPE                                      */
        /* ---------------------------------------------------- */
        body.name-effect-swipe .swipe-bar {
            display: block;
            position: absolute;
            top: 0; left: 0%;
            width: 3px; height: 100%;
            background: #ffffff;
            box-shadow: 0 0 15px #00FFFF, 0 0 5px #00FFFF;
            opacity: 0;
            transition: left 0.6s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.2s;
            z-index: 10;
        }
        body.name-effect-swipe .name-text-wrapper {
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
            transition: clip-path 0.6s cubic-bezier(0.77, 0, 0.175, 1);
        }
        body.name-effect-swipe .hero-logo-normal {
            opacity: 1;
            filter: invert(1);
            clip-path: polygon(0 0, 0 0, 0 100%, 0 100%);
            transition: clip-path 0.6s cubic-bezier(0.77, 0, 0.175, 1);
        }

        body.name-effect-swipe .hero-title-wrapper:hover .swipe-bar {
            opacity: 1;
            left: 100%;
        }
        body.name-effect-swipe .hero-title-wrapper:hover .name-text-wrapper {
            clip-path: polygon(100% 0, 100% 0, 100% 100%, 100% 100%);
        }
        body.name-effect-swipe .hero-title-wrapper:hover .hero-logo-normal {
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        }

        /* ---------------------------------------------------- */
        /* EFFECT 5: SHATTER                                    */
        /* ---------------------------------------------------- */
        body.name-effect-shatter .name-first, 
        body.name-effect-shatter .name-last {
            display: inline-block;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        body.name-effect-shatter .hero-logo-normal {
            opacity: 0;
            filter: invert(1);
            transform: scale(0);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        body.name-effect-shatter .hero-title-wrapper:hover .name-first {
            transform: translate(-50px, -30px) rotate(-15deg);
            opacity: 0; filter: blur(5px);
        }
        body.name-effect-shatter .hero-title-wrapper:hover .name-last {
            transform: translate(50px, 30px) rotate(15deg);
            opacity: 0; filter: blur(5px);
        }
        body.name-effect-shatter .hero-title-wrapper:hover .hero-logo-normal {
            opacity: 1;
            transform: scale(1);
            transition-delay: 0.1s;
        }

        /* ---------------------------------------------------- */
        /* EFFECT 6: BLUR                                       */
        /* ---------------------------------------------------- */
        body.name-effect-blur .name-text-wrapper {
            transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }
        body.name-effect-blur .hero-title-wrapper:hover .name-text-wrapper {
            letter-spacing: 25px;
            filter: blur(8px);
            transform: scaleX(1.3);
            color: #00FFFF; 
            opacity: 0;
        }

        /* ---------------------------------------------------- */

        .hero-container .location {
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        .hero-container .role {
            font-size: 1rem;
            text-transform: lowercase;
            color: #888888;
            margin-bottom: 3rem;
            letter-spacing: -0.01em;
        }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            border: 1px solid #ffffff;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: #ffffff;
            color: #000000;
        }

        .scroll-arrow {
            position: absolute;
            bottom: 40px;
            width: 16px;
            height: 16px;
            border-right: 1px solid #ffffff;
            border-bottom: 1px solid #ffffff;
            transform: rotate(45deg);
            opacity: 0.5;
        }

        /* 3. SLIDING WHITE LAYER OVERLAY */
        .white-layer {
            position: relative;
            z-index: 2;
            margin-top: 100vh;
            background-color: #ffffff;
            color: #000000;
            min-height: 100vh;
            box-shadow: 0 -15px 30px rgba(0, 0, 0, 0.4);
        }

        .white-header {
            position: sticky;
            top: 0;
            background-color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 5%;
            z-index: 10;
        }

        /* BRAND NAME & LOGOS */
        .brand-name {
            display: flex;
            align-items: center;
            position: relative;
            cursor: default; 
        }
        
        .logo-normal {
            height: 48px;
            width: auto;
            display: block;
            transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .logo-alt {
            height: 48px;
            width: auto;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transform: scale(0.95); 
            transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1), transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .brand-name:hover .logo-normal {
            opacity: 0; 
        }

        .brand-name:hover .logo-alt {
            opacity: 1; 
            transform: scale(1); 
        }

        .white-nav {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .white-nav a {
            color: #888888;
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.2s ease;
            cursor: pointer;
        }

        .white-nav a:hover, .white-nav a.active {
            color: #000000;
        }

        /* 4. TABS & CONTENT AREAS */
        .grid-container {
            padding: 1rem 5% 6rem 5%;
        }

        .tab-content {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .tab-content.active-tab {
            display: block;
        }

        /* 7. ORNAMENTAL FRAME STYLING */
        .ornate-frame-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5rem 2rem;
            min-height: 50vh;
        }

        .ornate-frame-container {
            position: relative;
            display: inline-block;
            width: 100%;
            max-width: 600px; 
        }

        .ornate-frame-bg {
            width: 100%;
            height: auto;
            display: block;
        }

        .ornate-frame-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%; 
            text-align: center;
        }

        .tab-text {
            font-size: 1.5rem;
            font-weight: normal;
            text-transform: lowercase;
            color: #000000;
            margin: 0;
            padding: 0;
        }

        .tab-text a {
            color: #000000;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .tab-text a
