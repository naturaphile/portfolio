<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        /* 1. AUTO-LOADS YOUR UPLOADED FONT */
        @font-face {
            font-family: 'HelveticaCustom';
            src: url('helvetica.woff') format('woff'),
                 url('helvetica.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* 2. COLOR VARIABLES FOR THE SCROLL INVERSION */
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'HelveticaCustom', Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.6s ease, color 0.6s ease;
            -webkit-font-smoothing: antialiased;
        }

        /* This class is triggered by JS when you scroll */
        body.scrolled {
            --bg-color: #ffffff;
            --text-color: #000000;
        }

        /* 3. HERO SECTION (Matches your screenshot) */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            position: relative;
        }

        .hero h1 {
            font-size: 3.5rem;
            line-height: 1.2;
            margin-bottom: 1.5rem;
            letter-spacing: -0.02em;
        }

        .hero p {
            font-size: 1rem;
            max-width: 550px;
            line-height: 1.6;
            margin-bottom: 3rem;
        }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            border: 1px solid var(--text-color);
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        /* Downward Chevron Arrow */
        .scroll-arrow {
            position: absolute;
            bottom: 50px;
            width: 20px;
            height: 20px;
            border-right: 1px solid var(--text-color);
            border-bottom: 1px solid var(--text-color);
            transform: rotate(45deg);
            opacity: 0.6;
        }

        /* 4. THE 3x3 IMAGE GRID */
        .portfolio-section {
            padding: 5rem 10%;
            min-height: 100vh;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .grid-item {
            aspect-ratio: 1 / 1;
            background-color: #f0f0f0; /* Clean grey placeholder */
            overflow: hidden;
            position: relative;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Mobile Responsiveness */
        @media (max-width: 900px) {
            .grid { grid-template-columns: repeat(2, 1fr); }
            .hero h1 { font-size: 2.5rem; }
        }
        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- HERO SECTION -->
    <div class="hero">
        <h1>Hi, I'm Jimmy.<br>Designer and<br>problem solver.</h1>
        <p>Welcome to my portfolio of work. I am a freelance designer based in Warrington, UK, creating effective, exciting and engaging branding solutions.</p>
        <a href="mailto:your@email.com" class="btn">Ask me a question</a>
        <div class="scroll-arrow"></div>
    </div>

    <!-- 3x3 GRID SECTION -->
    <div class="portfolio-section">
        <div class="grid">
            <!-- Automatically pulls files named 1.jpg to 9.jpg from your GitHub repo -->
            <div class="grid-item"><img src="1.jpg" onerror="this.style.opacity='0'"></div>
            <div class="grid-item"><img src="2.jpg" onerror="this.style.opacity='0'"></div>
            <div class="grid-item"><img src="3.jpg" onerror="this.style.opacity='0'"></div>
            <div class="grid-item"><img src="4.jpg" onerror="this.style.opacity='0'"></div>
            <div class="grid-item"><img src="5.jpg" onerror="this.style.opacity='0'"></div>
            <div class="grid-item"><img src="6.jpg" onerror="this.style.opacity='0'"></div>
            <div class="grid-item"><img src="7.jpg" onerror="this.style.opacity='0'"></div>
            <div class="grid-item"><img src="8.jpg" onerror="this.style.opacity='0'"></div>
            <div class="grid-item"><img src="9.jpg" onerror="this.style.opacity='0'"></div>
        </div>
    </div>

    <!-- SCRIPT FOR SCROLL INVERSION -->
    <script>
        window.addEventListener('scroll', () => {
            if (window.scrollY > 150) {
                document.body.classList.add('scrolled');
            } else {
                document.body.classList.remove('scrolled');
            }
        });
    </script>

</body>
</html>
