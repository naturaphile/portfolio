<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nathan Ramirez | Portfolio</title>
    <style>
        /* 1. AUTO-LOADS FONTS */
        @font-face {
            font-family: 'HelveticaCustom';
            src: url('helvetica.woff2') format('woff2'),
                 url('helvetica.woff') format('woff'),
                 url('helvetica.ttf') format('truetype'),
                 url('helvetica.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'HelveticaCustom';
            src: url('helvetica-bold.woff2') format('woff2'),
                 url('helvetica-bold.woff') format('woff'),
                 url('helvetica-bold.ttf') format('truetype'),
                 url('helvetica-bold.otf') format('opentype');
            font-weight: bold;
            font-style: normal;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'HelveticaCustom', Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #000000;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* 2. FIXED BLACK HERO SECTION */
        .hero-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            z-index: 1;
        }

        @keyframes quickFadeUp {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .hero-content {
            animation: quickFadeUp 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            will-change: filter, opacity; 
        }

        .hero-container h1 {
            font-size: 4.5rem;
            line-height: 1;
            margin-bottom: 2rem;
            font-weight: bold;
            text-transform: lowercase; 
        }

        /* XEROX STAMP NAME HOVER EFFECT */
        .name-first, .name-last {
            display: inline-block;
            color: #ffffff;
            letter-spacing: -0.04em;
            transition: all 0.15s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: default; 
        }

        .name-first:hover {
            color: #e0e0e0;
            transform: rotate(-1.5deg) scale(0.98) translateY(2px);
            text-shadow: 3px 3px 0px #444444;
            letter-spacing: -2px;
        }

        .name-last:hover {
            color: #e0e0e0;
            transform: rotate(1.5deg) scale(0.98) translateY(-1px);
            text-shadow: -3px 3px 0px #444444;
            letter-spacing: -2px;
        }

        .hero-container .location {
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        .hero-container .role {
            font-size: 1rem;
            text-transform: lowercase;
            color: #888888;
            margin-bottom: 3rem;
            letter-spacing: -0.01em;
        }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            border: 1px solid #ffffff;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: #ffffff;
            color: #000000;
        }

        .scroll-arrow {
            position: absolute;
            bottom: 40px;
            width: 16px;
            height: 16px;
            border-right: 1px solid #ffffff;
            border-bottom: 1px solid #ffffff;
            transform: rotate(45deg);
            opacity: 0.5;
        }

        /* 3. SLIDING WHITE LAYER OVERLAY */
        .white-layer {
            position: relative;
            z-index: 2;
            margin-top: 100vh;
            background-color: #ffffff;
            color: #000000;
            min-height: 100vh;
            box-shadow: 0 -15px 30px rgba(0, 0, 0, 0.4);
        }

        .white-header {
            position: sticky;
            top: 0;
            background-color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 5%;
            z-index: 10;
        }

        .brand-name {
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase; 
        }

        .white-nav {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .white-nav a {
            color: #888888;
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.2s ease;
            cursor: pointer;
        }

        .white-nav a:hover, .white-nav a.active {
            color: #000000;
        }

        /* 4. TABS & CONTENT AREAS */
        .grid-container {
            padding: 1rem 5% 6rem 5%;
        }

        .tab-content {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .tab-content.active-tab {
            display: block;
        }

        .tab-text {
            text-align: center;
            font-size: 1.5rem;
            font-weight: normal;
            text-transform: lowercase;
            padding: 10rem 2rem;
            color: #000000;
        }

        .tab-text a {
            color: #000000;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .tab-text a:hover {
            color: #888888;
        }

        /* 5. BASE GRID LAYOUT */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px; 
            max-width: 1200px;
            margin: 0 auto;
        }

        .grid-item {
            position: relative;
            background-color: transparent;
            cursor: pointer;
        }

        .grid-item-inner {
            position: relative;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background-color: #f2f2f2;
        }

        .grid-item-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), filter 0.6s ease;
        }

        /* ---------- TOGGLEABLE EFFECTS ---------- */

        body.effect-postit .grid-item {
            perspective: 1000px;
        }

        /* EXACT FOOTPRINT SHADOW */
        body.effect-postit .grid-item::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.35);
            opacity: 0; 
            transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none;
            z-index: 0;
        }

        body.effect-postit .grid-item:hover::before,
        body.effect-postit .grid-item.hovered::before {
            opacity: 1; 
        }

        /* 3D Lift applied ONLY to image card */
        body.effect-postit .grid-item-inner {
            transform-origin: top left; 
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            z-index: 2;
        }

        body.effect-postit .grid-item:hover .grid-item-inner,
        body.effect-postit .grid-item.hovered .grid-item-inner {
            transform: rotateX(-8deg) rotateY(8deg) scale(1.02);
        }

        /* B) BLUR EFFECT */
        body.effect-blur .grid-item:hover .grid-item-inner img,
        body.effect-blur .grid-item.hovered .grid-item-inner img {
            filter: blur(4px); 
            transform: scale(1.05); 
        }

        /* C) SHINE EFFECT */
        body.effect-shine .grid-item-inner::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            z-index: 10;
            transition: left 0.7s ease;
            pointer-events: none;
        }

        body.effect-shine .grid-item:hover .grid-item-inner::after,
        body.effect-shine .grid-item.hovered .grid-item-inner::after {
            left: 150%;
        }

        /* ---------- END TOGGLEABLE EFFECTS ---------- */

        /* Overlay & Text - INVERT FIX APPLIED HERE */
        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: transparent; /* No dark tint needed anymore */
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 15; 
            mix-blend-mode: difference; /* Blends the whole container against the image */
        }

        .grid-item:hover .overlay,
        .grid-item.hovered .overlay {
            opacity: 1;
        }

        .overlay-title {
            position: absolute;
            top: 10px; left: 10px;
            font-weight: bold;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #ffffff; /* Combined with difference makes pure inversion */
            /* Removed text-shadow for a clean read */
        }

        .overlay-caption {
            position: absolute;
            bottom: 10px; left: 10px;
            font-size: 0.8rem;
            font-weight: normal;
            line-height: 1.3;
            max-width: 90%;
            color: #ffffff; /* Combined with difference makes pure inversion */
        }

        /* 6. MODAL POPUP STYLING */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.show { opacity: 1; }

        .modal-content {
            position: relative;
            background-color: #ffffff;
            padding: 20px;
            padding-top: 50px;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .modal-close {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #000000;
            cursor: pointer;
            user-select: none;
            transition: color 0.2s;
        }

        .modal-close:hover { color: #888888; }

        .modal-content img {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
            display: block;
        }

        .modal-caption {
            margin-top: 15px;
            font-size: 1.8rem;
            font-weight: bold;
            color: #000000;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            white-space: pre-line;
        }

        /* Mobile Layout */
        @media (max-width: 900px) {
            .grid { grid-template-columns: repeat(2, 1fr); gap: 25px; }
            .hero-container h1 { font-size: 3rem; }
            .white-header { flex-direction: column; gap: 1rem; align-items: flex-start; }
            .tab-text { font-size: 1.2rem; padding: 5rem 1rem; }
            .modal-caption { font-size: 1.2rem; }
        }
        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
            .hero-container h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <div class="hero-content">
            <h1>
                <span class="name-first">nathan</span> 
                <span class="name-last">ramirez</span>
            </h1>
            <p class="location">LOS ANGELES, CA</p>
            <p class="role">freelance designer and creative director</p>
            <a href="mailto:nathanramirez@ucsb.edu" class="btn">Ask me a question</a>
        </div>
        <div class="scroll-arrow"></div>
    </div>

    <div class="white-layer">
        <header class="white-header">
            <div class="brand-name">nathan ramirez</div>
            <nav class="white-nav">
                <a class="active" data-target="projects">Projects</a>
                <a data-target="about">About</a>
                <a data-target="contact">Contact</a>
            </nav>
        </header>

        <main class="grid-container">
            <div id="projects-tab" class="tab-content active-tab" style="opacity: 1;">
                <div class="grid">
                    <div class="grid-item" data-index="1">
                        <div class="grid-item-inner">
                            <img src="1.jpg" onerror="tryNextFormat(this)">
                            <div class="overlay"><div class="overlay-title"></div><div class="overlay-caption"></div></div>
                        </div>
                    </div>
                    <div class="grid-item" data-index="2">
                        <div class="grid-item-inner">
                            <img src="2.jpg" onerror="tryNextFormat(this)">
                            <div class="overlay"><div class="overlay-title"></div><div class="overlay-caption"></div></div>
                        </div>
                    </div>
                    <div class="grid-item" data-index="3">
                        <div class="grid-item-inner">
                            <img src="3.jpg" onerror="tryNextFormat(this)">
                            <div class="overlay"><div class="overlay-title"></div><div class="overlay-caption"></div></div>
                        </div>
                    </div>
                    <div class="grid-item" data-index="4">
                        <div class="grid-item-inner">
                            <img src="4.jpg" onerror="tryNextFormat(this)">
                            <div class="overlay"><div class="overlay-title"></div><div class="overlay-caption"></div></div>
                        </div>
                    </div>
                    <div class="grid-item" data-index="5">
                        <div class="grid-item-inner">
                            <img src="5.jpg" onerror="tryNextFormat(this)">
                            <div class="overlay"><div class="overlay-title"></div><div class="overlay-caption"></div></div>
                        </div>
                    </div>
                    <div class="grid-item" data-index="6">
                        <div class="grid-item-inner">
                            <img src="6.jpg" onerror="tryNextFormat(this)">
                            <div class="overlay"><div class="overlay-title"></div><div class="overlay-caption"></div></div>
                        </div>
                    </div>
                    <div class="grid-item" data-index="7">
                        <div class="grid-item-inner">
                            <img src="7.jpg" onerror="tryNextFormat(this)">
                            <div class="overlay"><div class="overlay-title"></div><div class="overlay-caption"></div></div>
                        </div>
                    </div>
                    <div class="grid-item" data-index="8">
                        <div class="grid-item-inner">
                            <img src="8.jpg" onerror="tryNextFormat(this)">
                            <div class="overlay"><div class="overlay-title"></div><div class="overlay-caption"></div></div>
                        </div>
                    </div>
                    <div class="grid-item" data-index="9">
                        <div class="grid-item-inner">
                            <img src="9.jpg" onerror="tryNextFormat(this)">
                            <div class="overlay"><div class="overlay-title"></div><div class="overlay-caption"></div></div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="about-tab" class="tab-content">
                <h2 class="tab-text">nathan ramirez 2026</h2>
            </div>

            <div id="contact-tab" class="tab-content">
                <h2 class="tab-text"><a href="mailto:nathanramirez@ucsb.edu">nathanramirez@ucsb.edu</a></h2>
            </div>
        </main>
    </div>

    <!-- MODAL POPUP STRUCTURE -->
    <div id="image-modal" class="modal-overlay">
        <div class="modal-content">
            <span class="modal-close">&#10006;</span>
            <img id="modal-img" src="" alt="Project Presentation">
            <div id="modal-caption" class="modal-caption"></div>
        </div>
    </div>

    <script>
        // --- 1. CONFIG SYSTEM FETCH ---
        const defaultConfig = {
            postItEffect: true,
            blurEffect: true,
            shineEffect: true
        };

        fetch('config.json')
            .then(res => res.ok ? res.json() : defaultConfig)
            .catch(() => defaultConfig)
            .then(config => {
                if (config.postItEffect) document.body.classList.add('effect-postit');
                if (config.blurEffect) document.body.classList.add('effect-blur');
                if (config.shineEffect) document.body.classList.add('effect-shine');
            });

        // --- 2. HERO FADE & BLUR ---
        const heroContent = document.querySelector('.hero-content');
        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY;
            const windowHeight = window.innerHeight;
            
            let opacity = 1 - (scrollY / (windowHeight * 0.6));
            if (opacity < 0) opacity = 0;
            if (opacity > 1) opacity = 1;
            
            let blurValue = (scrollY / (windowHeight * 0.6)) * 15; 
            if (blurValue < 0) blurValue = 0;
            if (blurValue > 15) blurValue = 15;

            heroContent.style.opacity = opacity;
            heroContent.style.filter = `blur(${blurValue}px)`;
        });

        // --- 3. TABS LOGIC ---
        const navLinksTab = document.querySelectorAll('.white-nav a');
        const tabContents = document.querySelectorAll('.tab-content');

        navLinksTab.forEach(link => {
            link.addEventListener('click', (e) => {
                if (link.getAttribute('data-target')) {
                    e.preventDefault();
                    const targetId = link.getAttribute('data-target') + '-tab';
                    
                    navLinksTab.forEach(l => l.classList.remove('active'));
                    link.classList.add('active');

                    tabContents.forEach(tab => {
                        if (tab.classList.contains('active-tab') && tab.id !== targetId) {
                            tab.style.opacity = '0';
                            setTimeout(() => {
                                tab.classList.remove('active-tab');
                                const newTab = document.getElementById(targetId);
                                newTab.classList.add('active-tab');
                                setTimeout(() => {
                                    newTab.style.opacity = '1';
                                }, 50);
                            }, 300);
                        }
                    });
                }
            });
        });

        // --- 4. MODAL & INTERACTION LOGIC ---
        const modal = document.getElementById('image-modal');
        const modalImg = document.getElementById('modal-img');
        const modalCaptionText = document.getElementById('modal-caption');
        const closeBtn = document.querySelector('.modal-close');

        document.querySelectorAll('.grid-item').forEach(item => {
            item.addEventListener('click', function(e) {
                if (window.matchMedia("(pointer: coarse)").matches) {
                    if (!this.classList.contains('hovered')) {
                        e.preventDefault();
                        document.querySelectorAll('.grid-item').forEach(el => el.classList.remove('hovered'));
                        this.classList.add('hovered');
                        return; 
                    }
                }

                const img = this.querySelector('img');
                const titleText = this.querySelector('.overlay-title').innerText;
                modalImg.src = img.src;
                modalCaptionText.innerText = titleText; 
                
                modal.style.display = 'flex';
                setTimeout(() => modal.classList.add('show'), 10);
            });
        });

        const closeModal = () => {
            modal.classList.remove('show');
            setTimeout(() => {
                modal.style.display = 'none';
                document.querySelectorAll('.grid-item').forEach(el => el.classList.remove('hovered'));
            }, 300);
        };

        closeBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

        // --- 5. IMAGE FORMAT & TEXT LOGIC ---
        function tryNextFormat(img) {
            if (img.src.endsWith('.jpg')) {
                img.src = img.src.replace('.jpg', '.png');
            } else if (img.src.endsWith('.png')) {
                img.src = img.src.replace('.png', '.jpeg');
            } else if (img.src.endsWith('.jpeg')) {
                img.src = img.src.replace('.jpeg', '.webp');
            } else {
                img.style.opacity = '0';
            }
        }

        document.querySelectorAll('.grid-item').forEach(item => {
            const index = item.getAttribute('data-index');
            fetch(`${index}.txt`)
                .then(response => {
                    if (!response.ok) throw new Error('No text file found');
                    return response.text();
                })
                .then(text => {
                    const lines = text.trim().split('\n');
                    if (lines.length > 0) {
                        item.querySelector('.overlay-title').innerText = lines[0];
                        if (lines.length > 1) {
                            item.querySelector('.overlay-caption').innerText = lines.slice(1).join('\n');
                        }
                    }
                })
                .catch(error => {});
        });
    </script>
</body>
</html>
