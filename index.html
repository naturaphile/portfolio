<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nathan Ramirez | Portfolio</title>
    <style>
        /* 1. AUTO-LOADS FONTS (Normal and Bold weights) */
        @font-face {
            font-family: 'HelveticaCustom';
            src: url('helvetica.woff2') format('woff2'),
                 url('helvetica.woff') format('woff'),
                 url('helvetica.ttf') format('truetype'),
                 url('helvetica.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'HelveticaCustom';
            src: url('helvetica-bold.woff2') format('woff2'),
                 url('helvetica-bold.woff') format('woff'),
                 url('helvetica-bold.ttf') format('truetype'),
                 url('helvetica-bold.otf') format('opentype');
            font-weight: bold;
            font-style: normal;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'HelveticaCustom', Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #000000;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* 2. FIXED BLACK HERO SECTION */
        .hero-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            z-index: 1;
        }

        .hero-content {
            will-change: opacity;
            transition: opacity 0.05s linear;
        }

        .hero-container h1 {
            font-size: 4.5rem;
            line-height: 1;
            margin-bottom: 2rem;
            letter-spacing: -0.04em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .hero-container .location {
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        .hero-container .role {
            font-size: 1rem;
            text-transform: lowercase;
            color: #888888;
            margin-bottom: 3rem;
            letter-spacing: -0.01em;
        }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            border: 1px solid #ffffff;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: #ffffff;
            color: #000000;
        }

        .scroll-arrow {
            position: absolute;
            bottom: 40px;
            width: 16px;
            height: 16px;
            border-right: 1px solid #ffffff;
            border-bottom: 1px solid #ffffff;
            transform: rotate(45deg);
            opacity: 0.5;
        }

        /* 3. SLIDING WHITE LAYER OVERLAY */
        .white-layer {
            position: relative;
            z-index: 2;
            margin-top: 100vh;
            background-color: #ffffff;
            color: #000000;
            min-height: 100vh;
            box-shadow: 0 -15px 30px rgba(0, 0, 0, 0.4);
        }

        .white-header {
            position: sticky;
            top: 0;
            background-color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 5%;
            z-index: 10;
        }

        .brand-name {
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .white-nav {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .white-nav a {
            color: #888888;
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.2s ease;
        }

        .white-nav a:hover, .white-nav a.active {
            color: #000000;
        }

        /* 4. 3x3 PHOTO GRID WITH HOVER EFFECTS */
        .grid-container {
            padding: 1rem 5% 6rem 5%;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .grid-item {
            aspect-ratio: 1 / 1;
            background-color: #f2f2f2;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        /* Hover Overlay Layer */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* 50% darker */
            opacity: 0;
            transition: opacity 0.3s ease;
            color: #ffffff;
            pointer-events: none; /* Let clicks pass through to the image if needed later */
        }

        .grid-item:hover .overlay {
            opacity: 1;
        }

        /* Text Positioning (exactly 5px margins) */
        .overlay-title {
            position: absolute;
            top: 5px;
            left: 5px;
            font-weight: bold;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .overlay-caption {
            position: absolute;
            bottom: 5px;
            left: 5px;
            font-size: 0.8rem;
            font-weight: normal;
            line-height: 1.3;
            max-width: 90%;
        }

        /* Mobile Layout */
        @media (max-width: 900px) {
            .grid { grid-template-columns: repeat(2, 1fr); }
            .hero-container h1 { font-size: 3rem; }
            .white-header { flex-direction: column; gap: 1rem; align-items: flex-start; }
        }
        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
            .hero-container h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <div class="hero-content">
            <h1>NATHAN RAMIREZ</h1>
            <p class="location">LOS ANGELES, CA</p>
            <p class="role">freelance designer and creative director</p>
            <a href="mailto:your@email.com" class="btn">Ask me a question</a>
        </div>
        <div class="scroll-arrow"></div>
    </div>

    <div class="white-layer">
        <header class="white-header">
            <div class="brand-name">NATHAN RAMIREZ</div>
            <nav class="white-nav">
                <a href="#" class="active">Projects</a>
                <a href="#">About</a>
                <a href="mailto:your@email.com">Contact</a>
            </nav>
        </header>

        <main class="grid-container">
            <div class="grid">
                <!-- Data-index is used to fetch the correct .txt file -->
                <div class="grid-item" data-index="1"><img src="1.jpg" onerror="tryNextFormat(this)"><div class="overlay"><div class="overlay-title"></div><div class="overlay-caption"></div></div></div>
                <div class="grid-item" data-index="2"><img src="2.jpg" onerror="tryNextFormat(this)"><div class="overlay"><div class="overlay-title"></div><div class="overlay-caption"></div></div></div>
                <div class="grid-item" data-index="3"><img src="3.jpg" onerror="tryNextFormat(this)"><div class="overlay"><div class="overlay-title"></div><div class="overlay-caption"></div></div></div>
                <div class="grid-item" data-index="4"><img src="4.jpg" onerror="tryNextFormat(this)"><div class="overlay"><div class="overlay-title"></div><div class="overlay-caption"></div></div></div>
                <div class="grid-item" data-index="5"><img src="5.jpg" onerror="tryNextFormat(this)"><div class="overlay"><div class="overlay-title"></div><div class="overlay-caption"></div></div></div>
                <div class="grid-item" data-index="6"><img src="6.jpg" onerror="tryNextFormat(this)"><div class="overlay"><div class="overlay-title"></div><div class="overlay-caption"></div></div></div>
                <div class="grid-item" data-index="7"><img src="7.jpg" onerror="tryNextFormat(this)"><div class="overlay"><div class="overlay-title"></div><div class="overlay-caption"></div></div></div>
                <div class="grid-item" data-index="8"><img src="8.jpg" onerror="tryNextFormat(this)"><div class="overlay"><div class="overlay-title"></div><div class="overlay-caption"></div></div></div>
                <div class="grid-item" data-index="9"><img src="9.jpg" onerror="tryNextFormat(this)"><div class="overlay"><div class="overlay-title"></div><div class="overlay-caption"></div></div></div>
            </div>
        </main>
    </div>

    <script>
        const heroContent = document.querySelector('.hero-content');

        // Scroll fading effect
        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY;
            const windowHeight = window.innerHeight;
            let opacity = 1 - (scrollY / (windowHeight * 0.6));
            if (opacity < 0) opacity = 0;
            if (opacity > 1) opacity = 1;
            heroContent.style.opacity = opacity;
        });

        // Image auto-fallback
        function tryNextFormat(img) {
            if (img.src.endsWith('.jpg')) {
                img.src = img.src.replace('.jpg', '.png');
            } else if (img.src.endsWith('.png')) {
                img.src = img.src.replace('.png', '.jpeg');
            } else if (img.src.endsWith('.jpeg')) {
                img.src = img.src.replace('.jpeg', '.webp');
            } else {
                img.style.opacity = '0';
            }
        }

        // Fetch .txt files for hover text
        document.querySelectorAll('.grid-item').forEach(item => {
            const index = item.getAttribute('data-index');
            
            fetch(`${index}.txt`)
                .then(response => {
                    if (!response.ok) throw new Error('No text file found');
                    return response.text();
                })
                .then(text => {
                    // Split the text file by line breaks
                    const lines = text.trim().split('\n');
                    
                    if (lines.length > 0) {
                        // First line is the title
                        item.querySelector('.overlay-title').innerText = lines[0];
                        
                        // Remaining lines become the caption
                        if (lines.length > 1) {
                            item.querySelector('.overlay-caption').innerText = lines.slice(1).join('\n');
                        }
                    }
                })
                .catch(error => {
                    // If 1.txt is missing, it fails silently and shows no text.
                });
        });
    </script>

</body>
</html>
